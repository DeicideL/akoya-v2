<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akoya — Fiches Monstres</title>
  <style>
    :root {
      --bg-dark: #090708;
      --crimson-deep: #3b0910;
      --crimson-mid: #6b0f1a;
      --metal-highlight: rgba(255, 225, 228, 0.08);
      --text-main: #f5f1f2;
      --text-muted: #b8a9ac;
      --border-metal: rgba(255, 190, 198, 0.16);
      --pink-card: #f084e8;
      --pink-border: #ffabf6;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(135deg, var(--metal-highlight) 0%, transparent 45%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(circle at 20% 15%, var(--crimson-mid) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, var(--crimson-deep) 0%, var(--bg-dark) 70%);
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1.5rem 2.5rem 0.75rem;
    }

    .topbar {
      width: 100%;
      margin: 0 0 1.75rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 1.35rem;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      background: linear-gradient(160deg, rgba(35, 14, 18, 0.85), rgba(12, 9, 10, 0.92));
      border: 1px solid var(--border-metal);
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
      mix-blend-mode: screen;
    }

    .menu-dropdown {
      position: relative;
    }

    .menu-button {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.15rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      background: linear-gradient(160deg, rgba(35, 14, 18, 0.85), rgba(12, 9, 10, 0.92));
      border: 1px solid var(--border-metal);
      user-select: none;
    }

    .menu-button::-webkit-details-marker {
      display: none;
    }

    .nav-tabs {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      min-width: 210px;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.65rem;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(24, 10, 13, 0.97), rgba(10, 8, 9, 0.98));
      border: 1px solid var(--border-metal);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      z-index: 100;
    }

    .nav-tab {
      display: block;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .nav-tab:hover, .nav-tab.active {
      color: var(--text-main);
      border: 1px solid rgba(255, 120, 136, 0.5);
      background: linear-gradient(160deg, rgba(107, 15, 26, 0.72), rgba(34, 10, 14, 0.92));
    }

    .page-wrap {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Zone noire : création de fiche */
    .builder-zone {
      background: #050505;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 1.4rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }

    .builder-title {
      margin: 0 0 1rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .monster-picker-row {
      display: grid;
      grid-template-columns: 1fr 1.3fr auto;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .selected-preview {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: #121011;
      border: 1px solid var(--border-metal);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      min-height: 52px;
    }

    .selected-preview img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #1d181a;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #110f10;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    .btn-save {
      padding: 0.7rem 1.35rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 130, 150, 0.55);
      background: linear-gradient(160deg, #7a1220, #2c090e);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save:hover {
      filter: brightness(1.12);
    }

    /* Barre de recherche sur les monstres créés */
    .search-bar-wrap {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    /* Zone rose : grille en 2 colonnes des fiches monstres */
    .pink-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem 2.25rem;
    }

.pink-card {
  background: linear-gradient(160deg, rgba(42, 13, 18, 0.94), rgba(14, 10, 12, 0.96));
  border: 1px solid rgba(255, 130, 146, 0.35);
  border-radius: 10px;
  padding: 1.15rem 1.25rem;
  color: #f5f1f2;
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.pink-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  border-bottom: 1px solid rgba(255, 190, 198, 0.16);
  padding-bottom: 0.65rem;
}

.pink-monster-identity {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.pink-monster-identity img {
  width: 54px;
  height: 54px;
  border-radius: 8px;
  object-fit: cover;
  background: #181214;
  border: 1px solid rgba(255, 190, 198, 0.22);
}

.pink-monster-name {
  font-size: 1.1rem;
  font-weight: 800;
  margin: 0;
  color: #fff;
}

.pink-monster-sub {
  font-size: 0.82rem;
  font-weight: 600;
  color: #c8b4b8;
}

.btn-delete {
  padding: 0.35rem 0.65rem;
  border-radius: 6px;
  border: 1px solid rgba(255, 120, 136, 0.4);
  background: rgba(107, 15, 26, 0.45);
  color: #f5f1f2;
  font-weight: 700;
  font-size: 0.78rem;
  cursor: pointer;
}

.btn-delete:hover {
  background: rgba(130, 20, 34, 0.75);
}

.pink-section-title {
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #ff9aa8;
  margin: 0 0 0.2rem;
}

.pink-section-text {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.45;
  color: #f5f1f2;
  white-space: pre-line;
}

.pink-author {
  margin-top: auto;
  padding-top: 0.5rem;
  text-align: right;
  font-size: 0.8rem;
  font-weight: 700;
  color: #d6bec3;
}

    @media (max-width: 820px) {
      .monster-picker-row,
      .form-grid,
      .pink-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="Logo Akoya" />
      <span>Akoya</span>
    </a>

    <details class="menu-dropdown">
      <summary class="menu-button">☰ Menu</summary>
      <nav class="nav-tabs" aria-label="Navigation principale">
        <a class="nav-tab" href="index.html">Accueil</a>
        <a class="nav-tab active" href="projets.html">Projets</a>
        <a class="nav-tab" href="contact.html">Contact</a>
        <a class="nav-tab" href="event.html">Event guilde</a>
        <a class="nav-tab" href="absence.html">Absence</a>
        <a class="nav-tab" href="services.html">Services</a>
      </nav>
    </details>
  </header>

  <main class="page-wrap">
    <!-- Zone noire : sélection du monstre + runage + teams + conseils -->
    <section class="builder-zone">
      <h1 class="builder-title">Créer une fiche monstre</h1>

      <form id="monsterForm">
        <div class="monster-picker-row">
          <input type="text" id="swFilterInput" placeholder="Filtrer la liste des monstres SW..." />
          <select id="swMonsterSelect" required>
            <option value="">Chargement des monstres Summoners War...</option>
          </select>
          <div class="selected-preview" id="selectedPreview">
            <img id="previewImg" src="" alt="" style="display:none;" />
            <span id="previewText" class="pink-monster-sub" style="color:#b8a9ac;">Aucun monstre choisi</span>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="runesInput">Runage (sets, stats 2/4/6, artefacts)</label>
            <textarea id="runesInput" required placeholder="Ex : Violent / Will — SPD / PV% / PV%, +130 SPD, 85% RES"></textarea>
          </div>
          <div class="field">
            <label for="teamsInput">Teams jouées avec</label>
            <textarea id="teamsInput" required placeholder="Ex : Siege G4, RTA cleave, Géants Abyssal..."></textarea>
          </div>
          <div class="field">
            <label for="tipsInput">Conseils pour le jouer</label>
            <textarea id="tipsInput" required placeholder="Ex : Jouer juste après le strip, éviter contre tel contrôle..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn-save">Ajouter</button>
      </form>
    </section>

    <!-- Outil de recherche sur les monstres déjà ajoutés -->
    <div class="search-bar-wrap">
      <input type="text" id="cardSearchInput" placeholder="Rechercher un monstre dans tes fiches (nom, rune, team, conseil)..." />
    </div>

    <!-- Zone rose : chaque monstre apparaît ici -->
    <section class="pink-grid" id="pinkGrid"></section>
  </main>

  <script>
    const STORAGE_KEY = "akoya_sw_monster_cards_v1";
    const SWARFARM_API = "https://swarfarm.com/api/v2/monsters/?page_size=2000&obtainable=true&is_awakened=true";
    const SWARFARM_IMG = "https://swarfarm.com/static/herders/images/monsters/";
    const AUTH_API = "https://akoya-auth.onrender.com";

    let swMonsters = [];
    let savedCards = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let currentDiscordUser = null;

    const swFilterInput = document.getElementById("swFilterInput");
    const swMonsterSelect = document.getElementById("swMonsterSelect");
    const previewImg = document.getElementById("previewImg");
    const previewText = document.getElementById("previewText");
    const monsterForm = document.getElementById("monsterForm");
    const cardSearchInput = document.getElementById("cardSearchInput");
    const pinkGrid = document.getElementById("pinkGrid");

    async function loadCurrentDiscordUser() {
      const token = localStorage.getItem("akoya_token");
      if (!token) return;
      try {
        const res = await fetch(`${AUTH_API}/api/session`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.authenticated && data.user) {
          currentDiscordUser =
            data.user.globalName || data.user.username || "Membre Discord";
        }
      } catch {
        // Ignore en cas d'erreur réseau
      }
    }

    function populateMonsterSelect(filterText = "") {
      const q = filterText.trim().toLowerCase();
      const filtered = swMonsters.filter((m) =>
        m.name.toLowerCase().includes(q) || m.element.toLowerCase().includes(q)
      );

      swMonsterSelect.innerHTML = `<option value="">-- Choisir un monstre (${filtered.length}) --</option>`;
      filtered.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = String(m.id);
        opt.textContent = `${m.name} (${m.element} · ${m.natural_stars}★)`;
        swMonsterSelect.appendChild(opt);
      });

      if (filtered.length > 0 && q) {
        swMonsterSelect.value = String(filtered[0].id);
        updatePreview();
      }
    }

    function updatePreview() {
      const selected = swMonsters.find((m) => String(m.id) === swMonsterSelect.value);
      if (!selected) {
        previewImg.style.display = "none";
        previewText.textContent = "Aucun monstre choisi";
        return;
      }
      previewImg.src = `${SWARFARM_IMG}${selected.image_filename}`;
      previewImg.alt = selected.name;
      previewImg.style.display = "block";
      previewText.style.color = "#f5f1f2";
      previewText.textContent = `${selected.name} · ${selected.element} (${selected.natural_stars}★)`;
    }

    function saveCards() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedCards));
    }

    function renderPinkCards() {
      const q = cardSearchInput.value.trim().toLowerCase();
      const list = savedCards.filter((item) => {
        if (!q) return true;
        return (
          item.monsterName.toLowerCase().includes(q) ||
          item.runes.toLowerCase().includes(q) ||
          item.teams.toLowerCase().includes(q) ||
          item.tips.toLowerCase().includes(q) ||
          (item.author || "").toLowerCase().includes(q)
        );
      });

      pinkGrid.innerHTML = "";
      list.forEach((item) => {
        const card = document.createElement("article");
        card.className = "pink-card";
        card.innerHTML = `
          <div class="pink-card-header">
            <div class="pink-monster-identity">
              <img src="${item.imageUrl}" alt="${item.monsterName}" />
              <div>
                <h2 class="pink-monster-name">${item.monsterName}</h2>
                <div class="pink-monster-sub">${item.element} · ${item.stars}★ natif</div>
              </div>
            </div>
            <button type="button" class="btn-delete" data-id="${item.id}">Supprimer</button>
          </div>
          <div>
            <div class="pink-section-title">Runage</div>
            <p class="pink-section-text"></p>
          </div>
          <div>
            <div class="pink-section-title">Teams jouées</div>
            <p class="pink-section-text"></p>
          </div>
          <div>
            <div class="pink-section-title">Conseils</div>
            <p class="pink-section-text"></p>
          </div>
          <div class="pink-author"></div>
        `;
        const sections = card.querySelectorAll(".pink-section-text");
        sections[0].textContent = item.runes;
        sections[1].textContent = item.teams;
        sections[2].textContent = item.tips;
        card.querySelector(".pink-author").textContent = `Par ${item.author || "Anonyme"}`;

        card.querySelector(".btn-delete").addEventListener("click", () => {
          savedCards = savedCards.filter((c) => c.id !== item.id);
          saveCards();
          renderPinkCards();
        });

        pinkGrid.appendChild(card);
      });
    }

    monsterForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const selected = swMonsters.find((m) => String(m.id) === swMonsterSelect.value);
      if (!selected) return;

      const runes = document.getElementById("runesInput").value.trim();
      const teams = document.getElementById("teamsInput").value.trim();
      const tips = document.getElementById("tipsInput").value.trim();
      const author = currentDiscordUser || "Anonyme";

      savedCards.unshift({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        monsterName: selected.name,
        element: selected.element,
        stars: selected.natural_stars,
        imageUrl: `${SWARFARM_IMG}${selected.image_filename}`,
        runes,
        teams,
        tips,
        author
      });

      saveCards();
      renderPinkCards();
      monsterForm.reset();
      updatePreview();
    });

    swFilterInput.addEventListener("input", () => populateMonsterSelect(swFilterInput.value));
    swMonsterSelect.addEventListener("change", updatePreview);
    cardSearchInput.addEventListener("input", renderPinkCards);

    const FALLBACK_MONSTERS = [
      { id: 1, name: "Lushen", element: "wind", natural_stars: 4, image_filename: "unit_icon_0015_0_2.png" },
      { id: 2, name: "Veromos", element: "dark", natural_stars: 5, image_filename: "unit_icon_0034_0_4.png" },
      { id: 3, name: "Tiana", element: "wind", natural_stars: 5, image_filename: "unit_icon_0045_0_2.png" },
      { id: 4, name: "Zaiross", element: "fire", natural_stars: 5, image_filename: "unit_icon_0028_0_1.png" },
      { id: 5, name: "Bastet", element: "water", natural_stars: 5, image_filename: "unit_icon_0048_0_0.png" },
      { id: 6, name: "Leo", element: "wind", natural_stars: 5, image_filename: "unit_icon_0037_0_2.png" },
      { id: 7, name: "Rica", element: "fire", natural_stars: 5, image_filename: "unit_icon_0035_0_1.png" },
      { id: 8, name: "Seara", element: "wind", natural_stars: 5, image_filename: "unit_icon_0031_0_2.png" }
    ];

    async function initSwarfarm() {
      try {
        const res = await fetch("https://akoya-auth.onrender.com/api/sw-monsters");
        if (!res.ok) throw new Error("Réponse non OK");
        const list = await res.json();
        swMonsters = Array.isArray(list) && list.length > 0 ? list : FALLBACK_MONSTERS;
        populateMonsterSelect();
      } catch {
        swMonsters = FALLBACK_MONSTERS;
        populateMonsterSelect();
      }
    }

    loadCurrentDiscordUser();
    renderPinkCards();
    initSwarfarm();
  </script>
</body>
</html>
