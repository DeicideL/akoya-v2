<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akoya — Absence</title>
  <style>
    :root {
      --bg-dark: #090708;
      --crimson-deep: #3b0910;
      --crimson-mid: #6b0f1a;
      --metal-highlight: rgba(255, 225, 228, 0.08);
      --text-main: #f5f1f2;
      --text-muted: #b8a9ac;
      --border-metal: rgba(255, 190, 198, 0.16);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(135deg, var(--metal-highlight) 0%, transparent 45%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(circle at 20% 15%, var(--crimson-mid) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, var(--crimson-deep) 0%, var(--bg-dark) 70%);
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1.5rem 2rem 0.75rem;
    }

    .topbar {
      width: 100%;
      margin: 0 0 2rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 1.35rem;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      background: linear-gradient(160deg, rgba(35, 14, 18, 0.85), rgba(12, 9, 10, 0.92));
      border: 1px solid var(--border-metal);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .brand:hover {
      border-color: rgba(255, 190, 198, 0.35);
      transform: translateY(-1px);
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
      mix-blend-mode: screen;
    }

    .menu-dropdown {
      position: relative;
    }

    .menu-button {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.15rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      background: linear-gradient(160deg, rgba(35, 14, 18, 0.85), rgba(12, 9, 10, 0.92));
      border: 1px solid var(--border-metal);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      user-select: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .menu-button::-webkit-details-marker {
      display: none;
    }

    .menu-button:hover,
    .menu-dropdown[open] .menu-button {
      border-color: rgba(255, 120, 136, 0.5);
    }

    .nav-tabs {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      min-width: 210px;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.65rem;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(24, 10, 13, 0.97), rgba(10, 8, 9, 0.98));
      border: 1px solid var(--border-metal);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      z-index: 100;
    }

    .nav-tab {
      display: block;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .nav-tab:hover {
      color: var(--text-main);
      border-color: rgba(255, 190, 198, 0.25);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.active {
      color: var(--text-main);
      border-color: rgba(255, 120, 136, 0.5);
      background: linear-gradient(160deg, rgba(107, 15, 26, 0.72), rgba(34, 10, 14, 0.92));
    }

    .content {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      gap: 1.5rem;
    }

    .card {
      width: 100%;
      padding: 2rem;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(28, 12, 15, 0.88), rgba(10, 8, 9, 0.94));
      border: 1px solid var(--border-metal);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      letter-spacing: 0.03em;
    }

    h2 {
      margin: 0 0 1rem;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .sync-badge {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-metal);
    }

    .absence-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.9rem;
      margin-top: 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 9px;
      border: 1px solid var(--border-metal);
      background: rgba(9, 7, 8, 0.85);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      color-scheme: dark;
    }

    input:focus {
      outline: none;
      border-color: rgba(255, 120, 136, 0.65);
    }

    .btn-submit {
      justify-self: start;
      padding: 0.7rem 1.35rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 120, 136, 0.5);
      background: linear-gradient(160deg, rgba(107, 15, 26, 0.85), rgba(34, 10, 14, 0.95));
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .btn-submit:hover {
      border-color: rgba(255, 190, 198, 0.6);
      transform: translateY(-1px);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .cal-nav {
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-metal);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .cal-nav:hover {
      border-color: rgba(255, 120, 136, 0.5);
    }

    .cal-month-title {
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.4rem;
    }

    .cal-weekday {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.35rem 0;
    }

    .cal-day {
      min-height: 76px;
      padding: 0.45rem;
      border-radius: 9px;
      background: rgba(12, 9, 10, 0.72);
      border: 1px solid rgba(255, 190, 198, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .cal-day:hover {
      border-color: rgba(255, 190, 198, 0.35);
    }

    .cal-day.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .cal-day.today {
      border-color: rgba(255, 120, 136, 0.65);
    }

    .cal-day.selected {
      background: rgba(107, 15, 26, 0.28);
      border-color: rgba(255, 190, 198, 0.6);
    }

    .day-num {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .cal-day.today .day-num {
      color: var(--text-main);
    }

    .day-tag {
      font-size: 0.72rem;
      padding: 0.15rem 0.35rem;
      border-radius: 5px;
      background: rgba(107, 15, 26, 0.75);
      border: 1px solid rgba(255, 120, 136, 0.35);
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .absence-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.75rem;
    }

    .absence-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: rgba(12, 9, 10, 0.78);
      border: 1px solid var(--border-metal);
    }

    .absence-meta strong {
      color: var(--text-main);
    }

    .absence-dates {
      font-size: 0.85rem;
      color: #ff9aa6;
      margin-left: 0.4rem;
    }

    .absence-reason {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .btn-delete {
      padding: 0.35rem 0.65rem;
      border-radius: 7px;
      border: 1px solid rgba(255, 190, 198, 0.2);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      color: #ff9aa6;
      border-color: rgba(255, 120, 136, 0.55);
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 1.15rem;
        padding: 0.55rem 0.95rem;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
      }

      .card {
        padding: 1.25rem;
      }

      .cal-day {
        min-height: 58px;
        padding: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="Logo Akoya" />
      <span>Akoya</span>
    </a>

    <details class="menu-dropdown">
      <summary class="menu-button">☰ Menu</summary>
      <nav class="nav-tabs" aria-label="Navigation principale">
        <a class="nav-tab" href="index.html">Accueil</a>
        <a class="nav-tab" href="projets.html">Projets</a>
        <a class="nav-tab" href="contact.html">Contact</a>
        <a class="nav-tab" href="event.html">Event guilde</a>
        <a class="nav-tab active" href="absence.html">Absence</a>
        <a class="nav-tab" href="services.html">Services</a>
      </nav>
    </details>
  </header>

  <main class="content">
    <section class="card">
      <h1>Déclarer une absence</h1>
      <p>Indique ton pseudo, tes dates d'absence et la raison pour prévenir la guilde.</p>
      <span class="sync-badge" id="syncStatus">Connexion à la base en cours...</span>

      <form class="absence-form" id="absenceForm">
        <div class="field">
          <label for="pseudo">Pseudo</label>
          <input type="text" id="pseudo" placeholder="Ex : Deicide" required />
        </div>
        <div class="field">
          <label for="startDate">Absent du</label>
          <input type="date" id="startDate" required />
        </div>
        <div class="field">
          <label for="endDate">Au (inclus)</label>
          <input type="date" id="endDate" required />
        </div>
        <div class="field full">
          <label for="reason">Pourquoi ?</label>
          <input type="text" id="reason" placeholder="Ex : Vacances, travail, perso, examens... Si raison perso, vous pouvez me mp (sauf si trop perso)" required />
        </div>
        <button type="submit" class="btn-submit">Ajouter mon absence</button>
      </form>
    </section>

    <section class="card">
      <div class="calendar-header">
        <button type="button" class="cal-nav" id="prevMonth">← Précédent</button>
        <div class="cal-month-title" id="monthTitle"></div>
        <button type="button" class="cal-nav" id="nextMonth">Suivant →</button>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <section class="card">
      <h2 id="listTitle">Toutes les absences enregistrées</h2>
      <div class="absence-list" id="absenceList"></div>
    </section>
  </main>

  <script>
    const menu = document.querySelector('.menu-dropdown');
    document.addEventListener('click', (e) => {
      if (menu && menu.open && !menu.contains(e.target)) {
        menu.open = false;
      }
    });

    const AUTH_BASE_URL = "https://akoya-auth.onrender.com";
    const FIREBASE_DB_URL = "https://akoya-guilde-default-rtdb.europe-west1.firebasedatabase.app";

    const STORAGE_KEY = "akoya_absences_v1";
    let absences = [];
    let currentDate = new Date();
    let selectedDayStr = null;

    // Par défaut false tant que la session n'est pas vérifiée
    let userPermissions = {
      authenticated: false,
      canWrite: false,
      canDelete: false
    };

    const syncStatus = document.getElementById("syncStatus");
    const monthTitle = document.getElementById("monthTitle");
    const calendarGrid = document.getElementById("calendarGrid");
    const absenceList = document.getElementById("absenceList");
    const listTitle = document.getElementById("listTitle");

    function formatDateFR(dateStr) {
      const [y, m, d] = dateStr.split("-");
      return `${d}/${m}/${y}`;
    }

    function toISODate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

async function checkSession() {
      if (window.location.hash && window.location.hash.includes("token=")) {
        const params = new URLSearchParams(window.location.hash.slice(1));
        const urlToken = params.get("token");
        if (urlToken) {
          localStorage.setItem("akoya_token", urlToken);
          history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      }

      const savedToken = localStorage.getItem("akoya_token");
      if (!savedToken) {
        window.location.href = `${AUTH_BASE_URL}/login`;
        return false;
      }

      try {
        const res = await fetch(`${AUTH_BASE_URL}/api/session`, {
          headers: { Authorization: `Bearer ${savedToken}` }
        });
        if (!res.ok) {
          localStorage.removeItem("akoya_token");
          window.location.href = `${AUTH_BASE_URL}/login`;
          return false;
        }
        const data = await res.json();
        if (!data.authenticated || !data.canWrite) {
          window.location.href = `${AUTH_BASE_URL}/login`;
          return false;
        }
        userPermissions = {
          authenticated: true,
          canWrite: Boolean(data.canWrite),
          canDelete: Boolean(data.canDelete)
        };
        return true;
      } catch (err) {
        console.error("Erreur vérification session :", err);
        return false;
      }
    }

    async function loadAbsences() {
      if (FIREBASE_DB_URL) {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/absences.json`);
          if (!res.ok) throw new Error("Erreur HTTP");
          const data = await res.json();
          absences = data
            ? Object.entries(data).map(([id, val]) => ({ id, ...val }))
            : [];
          syncStatus.textContent = userPermissions.canDelete
            ? "Synchronisé en ligne — Droits : Écriture + Suppression"
            : "Synchronisé en ligne — Droits : Écriture uniquement (suppression réservée)";
        } catch (err) {
          syncStatus.textContent = "Erreur de connexion à la base partagée";
        }
      } else {
        absences = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      }
      renderAll();
    }

    async function addAbsence(item) {
      if (!userPermissions.canWrite) {
        alert("Tu n'as pas l'autorisation d'ajouter une absence.");
        return;
      }

      if (FIREBASE_DB_URL) {
        const res = await fetch(`${FIREBASE_DB_URL}/absences.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(item)
        });
        if (!res.ok) {
          alert("Impossible d'enregistrer l'absence (vérifie les règles Firebase).");
          return;
        }
        const data = await res.json();
        absences.push({ id: data.name, ...item });
      } else {
        item.id = String(Date.now());
        absences.push(item);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(absences));
      }
      renderAll();
    }

    async function deleteAbsence(id) {
      if (!userPermissions.canDelete) {
        alert("Accès refusé : seul le rôle autorisé peut supprimer une absence.");
        return;
      }

      if (FIREBASE_DB_URL) {
        const res = await fetch(`${FIREBASE_DB_URL}/absences/${id}.json`, {
          method: "DELETE"
        });
        if (!res.ok) {
          alert("Impossible de supprimer l'absence sur Firebase.");
          return;
        }
      }

      absences = absences.filter((a) => a.id !== id);
      if (!FIREBASE_DB_URL) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(absences));
      }
      renderAll();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const todayStr = toISODate(new Date());

      monthTitle.textContent = new Intl.DateTimeFormat("fr-FR", {
        month: "long",
        year: "numeric"
      }).format(new Date(year, month, 1));

      calendarGrid.innerHTML = "";
      const weekdays = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
      weekdays.forEach((day) => {
        const el = document.createElement("div");
        el.className = "cal-weekday";
        el.textContent = day;
        calendarGrid.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const offset = (firstDay + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < offset; i++) {
        const empty = document.createElement("div");
        empty.className = "cal-day empty";
        calendarGrid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const cell = document.createElement("div");
        cell.className = "cal-day";
        if (dateStr === todayStr) cell.classList.add("today");
        if (dateStr === selectedDayStr) cell.classList.add("selected");

        const num = document.createElement("div");
        num.className = "day-num";
        num.textContent = d;
        cell.appendChild(num);

        const dayAbsences = absences.filter(
          (a) => dateStr >= a.startDate && dateStr <= a.endDate
        );

        dayAbsences.slice(0, 2).forEach((a) => {
          const tag = document.createElement("div");
          tag.className = "day-tag";
          tag.textContent = a.pseudo;
          tag.title = `${a.pseudo} : ${a.reason}`;
          cell.appendChild(tag);
        });

        if (dayAbsences.length > 2) {
          const more = document.createElement("div");
          more.className = "day-tag";
          more.textContent = `+${dayAbsences.length - 2} autre(s)`;
          cell.appendChild(more);
        }

        cell.addEventListener("click", () => {
          selectedDayStr = selectedDayStr === dateStr ? null : dateStr;
          renderAll();
        });

        calendarGrid.appendChild(cell);
      }
    }

    function renderList() {
      const filtered = selectedDayStr
        ? absences.filter((a) => selectedDayStr >= a.startDate && selectedDayStr <= a.endDate)
        : [...absences].sort((a, b) => a.startDate.localeCompare(b.startDate));

      listTitle.textContent = selectedDayStr
        ? `Absences le ${formatDateFR(selectedDayStr)} (clique à nouveau sur le jour pour tout voir)`
        : "Toutes les absences enregistrées";

      absenceList.innerHTML = "";
      if (filtered.length === 0) {
        absenceList.innerHTML = `<p>Aucune absence enregistrée${selectedDayStr ? " à cette date" : ""}.</p>`;
        return;
      }

      filtered.forEach((a) => {
        const item = document.createElement("div");
        item.className = "absence-item";

        const meta = document.createElement("div");
        meta.className = "absence-meta";
        meta.innerHTML = `
          <div>
            <strong>${escapeHTML(a.pseudo)}</strong>
            <span class="absence-dates">du ${formatDateFR(a.startDate)} au ${formatDateFR(a.endDate)}</span>
          </div>
          <div class="absence-reason">${escapeHTML(a.reason)}</div>
        `;

        item.appendChild(meta);

        // Bouton Supprimer visible uniquement pour le rôle 1340812084983627796 (canDelete: true)
        if (userPermissions.canDelete) {
          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn-delete";
          del.textContent = "Supprimer";
          del.addEventListener("click", () => deleteAbsence(a.id));
          item.appendChild(del);
        }

        absenceList.appendChild(item);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function renderAll() {
      renderCalendar();
      renderList();
    }

    document.getElementById("absenceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pseudo = document.getElementById("pseudo").value.trim();
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const reason = document.getElementById("reason").value.trim();

      if (endDate < startDate) {
        alert("La date de fin doit être égale ou postérieure à la date de début.");
        return;
      }

      await addAbsence({ pseudo, startDate, endDate, reason });
      e.target.reset();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    (async () => {
      const ok = await checkSession();
      if (ok) {
        await loadAbsences();
      }
    })();
  </script>
</body>
</html>
