<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akoya — Accueil</title>
  <style>
    :root {
      --bg-dark: #090708;
      --crimson-deep: #3b0910;
      --crimson-mid: #6b0f1a;
      --metal-highlight: rgba(255, 225, 228, 0.08);
      --text-main: #f5f1f2;
      --text-muted: #b8a9ac;
      --border-metal: rgba(255, 190, 198, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(135deg, var(--metal-highlight) 0%, transparent 45%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(circle at 20% 15%, var(--crimson-mid) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, var(--crimson-deep) 0%, var(--bg-dark) 70%);
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1.5rem 2rem 0.75rem;
    }

    .topbar {
      width: 100%;
      margin: 0 0 2rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.75rem 1.35rem;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-main);
      text-decoration: none;
      background: linear-gradient(160deg, rgba(35, 14, 18, 0.85), rgba(12, 9, 10, 0.92));
      border: 1px solid var(--border-metal);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .brand:hover {
      border-color: rgba(255, 190, 198, 0.35);
      transform: translateY(-1px);
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
      mix-blend-mode: screen;
    }

    .menu-dropdown {
      position: relative;
    }

    .menu-button {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.15rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      background: linear-gradient(160deg, rgba(35, 14, 18, 0.85), rgba(12, 9, 10, 0.92));
      border: 1px solid var(--border-metal);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      user-select: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .menu-button::-webkit-details-marker {
      display: none;
    }

    .menu-button:hover,
    .menu-dropdown[open] .menu-button {
      border-color: rgba(255, 120, 136, 0.5);
    }

    .nav-tabs {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      min-width: 210px;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.65rem;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(24, 10, 13, 0.97), rgba(10, 8, 9, 0.98));
      border: 1px solid var(--border-metal);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      z-index: 100;
    }

    .nav-tab {
      display: block;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .nav-tab:hover {
      color: var(--text-main);
      border-color: rgba(255, 190, 198, 0.25);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.active {
      color: var(--text-main);
      border-color: rgba(255, 120, 136, 0.5);
      background: linear-gradient(160deg, rgba(107, 15, 26, 0.72), rgba(34, 10, 14, 0.92));
    }

    .content {
      flex: 1;
      display: grid;
      place-items: center;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 2.5rem;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(28, 12, 15, 0.88), rgba(10, 8, 9, 0.94));
      border: 1px solid var(--border-metal);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.03em;
    }

    p {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.65;
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 1.15rem;
        padding: 0.55rem 0.95rem;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="Logo Akoya" />
      <span>Akoya</span>
    </a>

    <details class="menu-dropdown">
      <summary class="menu-button">☰ Menu</summary>
      <nav class="nav-tabs" aria-label="Navigation principale">
        <a class="nav-tab" href="index.html">Accueil</a>
        <a class="nav-tab" href="projets.html">Projets</a>
        <a class="nav-tab active" href="contact.html">Contact</a>
        <a class="nav-tab" href="event.html">Event guilde</a>
        <a class="nav-tab" href="absence.html">Absence</a>
        <a class="nav-tab" href="services.html">Services</a>
      </nav>
    </details>
  </header>

  <main class="content">
    <section class="card">
      <h1>Bonjour, tout le monde !</h1>
      <p>Ce site est hébergé par un vieux cafard</p>
    </section>
  </main>

  <script>
    const menu = document.querySelector('.menu-dropdown');
    document.addEventListener('click', (e) => {
      if (menu && menu.open && !menu.contains(e.target)) {
        menu.open = false;
      }
    });
  </script>
</body>
</html>
